name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      metrics_mode:
        description: Metrics source policy to exercise
        required: true
        default: push
        type: choice
        options:
          - push
          - schedule
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest
      - uses: withastro/action@v6
        env:
          METRICS_MODE: ${{ (github.event_name == 'schedule' || inputs.metrics_mode == 'schedule') && 'schedule' || 'push' }}
        with:
          path: .
          package-manager: pnpm@10.34.5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
