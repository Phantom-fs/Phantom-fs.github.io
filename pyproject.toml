[build-system]
requires = []
build-backend = 'setuptools.build_meta'

[project]
name = 'modern-academic-website-metrics'
version = '0.1.0'
requires-python = '>=3.13,<3.14'
dependencies = [
  'scholarly==1.7.11',
]

[dependency-groups]
test = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ['tests/python', 'tests/metrics']
addopts = '-ra'
